<style>
:root{--bg:#fff3dc;--ink:#5a3d2e;--card:#fffaf0;--hl:#ffd27a;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none}
html,body{height:100%;margin:0;background:var(--bg);color:var(--ink);font-family:"Hannotate TC","Yuanti TC","jf-openhuninn","Microsoft JhengHei",cursive,sans-serif;overflow:hidden}
#app{height:100%;display:flex;flex-direction:column}

#scene{position:relative;height:100%;aspect-ratio:9/15;max-width:100%;container-type:size;overflow:hidden;border:3px solid var(--ink);border-radius:18px;background:#ffe9c7}
#scene>*{position:absolute}
.h{filter:url(#wob)}

.it{width:15cqw;height:14cqw;text-align:center;font-size:10cqw;line-height:1;cursor:pointer;z-index:4;display:flex;flex-direction:column;align-items:center;justify-content:flex-end}
.it:active{transform:scale(.9)}

.bar{position:absolute;left:10%;bottom:-2cqw;width:80%;height:1.4cqw;background:#fff;border:.4cqw solid var(--ink);border-radius:2cqw;overflow:hidden;display:none}
.bar i{display:block;height:100%;width:0;background:#ff9f6b}
#bar{z-index:5;width:20cqw;height:20cqw;left:73%;top:38%;transform:translate(0,-100%);filter:url(#wob);animation:bob 1.6s ease-in-out infinite}

#tray{left:6%;top:36.6%;width:62%;height:6.4%;z-index:7;background:#fff8e8;border:.8cqw solid var(--ink);border-radius:3cqw;display:flex;align-items:center;justify-content:center;gap:2cqw;font-size:6cqw;cursor:pointer}

.cu .em{display:block;animation:bob2 1s ease-in-out infinite}

.bub{position:absolute;bottom:100%;left:50%;transform:translateX(-50%);background:#fff;border:.8cqw solid var(--ink);border-radius:4cqw;padding:1cqw 3cqw;font-size:5.5cqw;white-space:nowrap;text-align:center;display:none}

.pop{z-index:20;transform:translate(-50%,-100%);font-size:6cqw;font-weight:bold;color:#c0392b;animation:up 1.1s forwards;pointer-events:none;text-shadow:0 0 3px #fff,0 0 3px #fff}

#toast{left:50%;top:52%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:2cqw 5cqw;border-radius:6cqw;font-size:4.6cqw;z-index:30;opacity:0;transition:opacity .25s;pointer-events:none;white-space:nowrap}
.ov{inset:0;z-index:40;background:rgba(90,61,46,.45);display:none;flex-direction:column;align-items:center;justify-content:center;gap:4cqw;color:#fff;text-align:center}
.ov.on{display:flex}
.ov h1{margin:0;font-size:11cqw;text-shadow:0 .8cqw 0 #5a3d2e}
.ov p{margin:0;font-size:5cqw;padding:0 8cqw}
.btn{font:inherit;font-size:6cqw;padding:2.5cqw 9cqw;border:1cqw solid var(--ink);border-radius:8cqw;background:var(--hl);color:#5a3d2e;cursor:pointer;box-shadow:0 1cqw 0 var(--ink)}
.btn:active{transform:translateY(1cqw);box-shadow:none}
#pick{display:flex;gap:8px;padding:8px 8px 10px;justify-content:center}
#pick button{font:inherit;flex:1;max-width:100px;background:var(--card);color:var(--ink);border:3px solid var(--ink);border-radius:16px;padding:4px 2px;cursor:pointer;font-size:14px;font-weight:bold}
#pick button.on{background:var(--hl);transform:translateY(-4px)}
#pick svg{width:100%;height:auto;max-height:54px;display:block}
#pickt{text-align:center;font-size:13px;opacity:.8;padding-top:2px}
.wall{background:linear-gradient(transparent 84%,#e3b98a 84%,#e3b98a 100%),radial-gradient(circle,#ffd29a 0 1cqw,transparent 1.1cqw) 0 0/7cqw 7cqw,#ffe6bd}

.win{background:none!important;border:0!important;padding:0;font-size:0}
.clock{line-height:0}

.chair{background:linear-gradient(#f6a083,#e58b6b);border-radius:3cqw 3cqw 1.5cqw 1.5cqw}
.it svg{height:11cqw;width:auto;max-width:100%;filter:url(#wob) drop-shadow(0 .5cqw 0 rgba(90,61,46,.2))}
#mach svg{height:12.5cqw}
#bar{width:23cqw;height:23cqw;filter:url(#wob) drop-shadow(0 .6cqw 0 rgba(90,61,46,.2))}
.cu .em svg{width:17cqw;height:17cqw;display:block;overflow:visible;filter:url(#wob) drop-shadow(0 .6cqw 0 rgba(90,61,46,.2))}
.bub{box-shadow:0 .8cqw 0 rgba(90,61,46,.2)}
.bub::after{content:'';position:absolute;left:50%;top:100%;margin-left:-1.5cqw;border:1.5cqw solid transparent;border-top-color:var(--ink)}
.menu{left:34%;top:3.5%;width:36%;height:15%;font-size:4.2cqw;line-height:1.3;padding:1cqw 2.5cqw;display:flex;flex-direction:column;justify-content:center;text-align:left;white-space:nowrap}
.menu b{text-align:center;font-size:4.8cqw;border-bottom:.5cqw dashed rgba(255,255,255,.6);margin-bottom:.8cqw;letter-spacing:.6cqw}
.chips{display:flex;gap:1.6cqw;align-items:center;font-size:4.6cqw}
.chips button{font:inherit;font-size:4.4cqw;padding:1cqw 2.6cqw;border:.8cqw solid var(--ink);border-radius:5cqw;background:#fff;color:#5a3d2e;cursor:pointer}
.chips button.on{background:var(--hl);transform:translateY(-.6cqw);box-shadow:0 .6cqw 0 var(--ink)}
.it{width:13.5cqw}
#bar{left:75%}
.clock{left:79%}
.menu{left:32%;top:5%;width:43%;height:15%;font-size:3.6cqw;line-height:1.25;padding:.8cqw 2cqw}
.menu b{font-size:4.2cqw;margin-bottom:.4cqw}
.mg{display:grid;grid-template-rows:repeat(4,auto);grid-auto-flow:column;gap:0 3cqw}
#case{display:none;left:6%;top:6.5%;width:64%;z-index:25;background:#fffaf0;border:.9cqw solid var(--ink);border-radius:4cqw;padding:2cqw;justify-content:space-around;box-shadow:0 1cqw 0 rgba(90,61,46,.25)}
#case.on{display:flex}
#case button{font:inherit;border:0;background:none;display:flex;flex-direction:column;align-items:center;font-size:9cqw;line-height:1.1;cursor:pointer;color:#5a3d2e}

html,body,button{font-family:"Chiron GoRound TC","Hannotate TC","Yuanti TC","jf-openhuninn","Microsoft JhengHei",sans-serif}
:root{--dot:#ffe0b0}@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--dot:#4a3a33}}
body{background:radial-gradient(circle,var(--dot) 1.4px,transparent 1.7px) 0 0/18px 18px,var(--bg)}
#hud{gap:6px;padding:8px 10px}
#hud>span{flex:1;text-align:center;background:var(--card);border:2.5px solid var(--ink);border-radius:14px;padding:3px 0;font-size:15px;box-shadow:0 3px 0 var(--ink)}
#scene{border-radius:24px;box-shadow:0 5px 0 var(--ink),0 12px 20px rgba(90,61,46,.25)}
#scene::after{content:'';position:absolute;inset:0;z-index:50;pointer-events:none;background:radial-gradient(ellipse at 50% 42%,transparent 55%,rgba(150,80,40,.22))}
.it::before{content:'';position:absolute;left:6%;right:6%;bottom:3.6cqw;height:4cqw;background:rgba(90,61,46,.13);border-radius:50%;z-index:-1}

.counter-front{box-shadow:inset 0 1.5cqw 0 rgba(255,255,255,.22),0 1.5cqw 0 rgba(90,61,46,.15)}
#pick button{box-shadow:0 4px 0 var(--ink);border-radius:18px}

.ov{background:radial-gradient(circle at 50% 40%,rgba(255,200,120,.35),rgba(90,61,46,.6));gap:2.4cqw}
.ov h1{-webkit-text-stroke:.8cqw #5a3d2e;paint-order:stroke fill;text-shadow:0 1cqw 0 #5a3d2e;letter-spacing:.8cqw}
.btn{background:linear-gradient(#ffe29a,#ffc25c)}
.chips{flex-wrap:wrap;justify-content:center}
.chips span{width:100%;text-align:center;font-size:4cqw!important}
.chips.lv button{font-size:3.9cqw;padding:.9cqw 2.2cqw}
.lvd{font-size:3.7cqw;margin-top:-1cqw;padding:0 6cqw}
</style>

<body>
<svg width="0" height="0" style="position:absolute"><filter id="wob"><feTurbulence type="fractalNoise" baseFrequency=".035" numOctaves="2" seed="4"/><feDisplacementMap in="SourceGraphic" scale="3.5"/></filter></svg>
<div id="app">
 <div id="hud"><span>🪙 <span id="coins">0</span></span><span>⏱ <span id="time">90</span></span><span>😊 <span id="served">0</span></span></div>
 <div id="stage"><div id="scene">
  <div class="wall h"></div><div class="floor h"></div>
  <div class="win h">🌤️</div><div class="menu h">MENU<br>☕美式 ☕🥛拿鐵<br>🍰蛋糕</div><div class="clock h">🕐</div>
  <div class="prep h"></div>
  <div class="lab" style="left:5%;top:36.2%;z-index:2;display:none"></div>
  <div class="it" id="mach" style="left:5%;top:19.5%"><svg viewBox="0 0 60 56" width="100%" class="h"><rect x="6" y="4" width="48" height="40" rx="8" fill="#d9644a" stroke="#5a3d2e" stroke-width="3"/><rect x="14" y="12" width="32" height="12" rx="4" fill="#ffe6bd" stroke="#5a3d2e" stroke-width="2.5"/><rect x="22" y="30" width="16" height="14" rx="3" fill="#fff" stroke="#5a3d2e" stroke-width="2.5"/><circle cx="48" cy="12" r="3" fill="#ffd27a"/></svg><small>咖啡機</small><div class="bar"><i></i></div></div>
  <div class="it" id="milk" style="left:23%;top:19.5%">🥛<small>加牛奶</small></div>
  <div class="it" id="cake" style="left:41%;top:19.5%">🍰<small>蛋糕</small></div>
  <div class="it" id="trash" style="left:59%;top:19.5%">🗑️<small>倒掉</small></div>
  <div class="lab" style="left:4%;top:34.6%;z-index:3;font-size:3cqw">料理台</div>
  <div id="bar"></div>
  <div class="counter-top h"></div><div class="counter-front h">櫃檯 ‧ 點我送餐</div>
  <div id="tray"><span>托盤（點我送餐）</span></div><div id="reg">💰</div>
  <div class="rug h"></div>
  <div class="table h" style="left:9%;top:83%"></div><div class="table h" style="left:39%;top:83%"></div><div class="table h" style="left:69%;top:83%"></div>
  <div class="chair h" style="left:6%;top:86%"></div><div class="chair h" style="left:36%;top:86%"></div><div class="chair h" style="left:66%;top:86%"></div>
  <div class="lab" style="left:40%;top:94%;font-size:3.4cqw">🪑 客人座位區</div>
  <div id="toast"></div>
  <div class="ov on" id="start"><h1>小小咖啡店</h1><p>客人點餐 → 在料理台做好 → 點櫃檯送餐！<br>先從下方選一位店員吧 👇</p><button class="btn" id="go">開店囉！</button></div>
  <div class="ov" id="end"><h1>打烊啦！</h1><p id="sum"></p><button class="btn" id="again">再開一天</button></div>
 </div></div>
 <div><div id="pickt">選擇你的店員（隨時可換）</div><div id="pick"></div></div>
</div>
<script>
const $=s=>document.querySelector(s),L='#5a3d2e';
const S=(b)=>`<svg viewBox="0 0 100 100" style="overflow:visible" fill="none" stroke="${L}" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round">${b}</svg>`;
const cl=[[30,45,16],[50,36,18],[70,45,16],[22,64,14],[78,64,14],[50,68,22]];
const CH=[
{n:'小蝸牛',s:S(`<ellipse cx="48" cy="82" rx="40" ry="13" fill="#f4d6a0"/><ellipse cx="24" cy="62" rx="14" ry="19" fill="#f4d6a0"/><path d="M19 46L14 28M30 46L35 28"/><circle cx="14" cy="26" r="4" fill="#fff"/><circle cx="35" cy="26" r="4" fill="#fff"/><circle cx="20" cy="60" r="2.5" fill="${L}"/><circle cx="30" cy="60" r="2.5" fill="${L}"/><ellipse cx="16" cy="67" rx="3" ry="2" fill="#ffa0a0" stroke="none"/><ellipse cx="34" cy="67" rx="3" ry="2" fill="#ffa0a0" stroke="none"/><path d="M21 68Q25 72 29 68"/><circle cx="64" cy="58" r="25" fill="#ff9f6b"/><path d="M64 58a4 4 0 1 1 4 4a9 9 0 1 1-9-9a14 14 0 1 1 14 14"/>`)},
{n:'綠繡眼綠豆',s:S(`<ellipse cx="18" cy="62" rx="9" ry="16" fill="#7fae43" transform="rotate(15 18 62)"/><ellipse cx="82" cy="62" rx="9" ry="16" fill="#7fae43" transform="rotate(-15 82 62)"/><circle cx="50" cy="56" r="34" fill="#9bc65a"/><ellipse cx="50" cy="72" rx="22" ry="16" fill="#f6f2c8" stroke="none"/><ellipse cx="50" cy="63" rx="11" ry="6" fill="#ffe36b" stroke="none"/><circle cx="37" cy="46" r="9" fill="#fff"/><circle cx="63" cy="46" r="9" fill="#fff"/><circle cx="38" cy="47" r="4.5" fill="${L}"/><circle cx="62" cy="47" r="4.5" fill="${L}"/><path d="M44 54L56 54L50 62Z" fill="#f5a742"/><ellipse cx="27" cy="60" rx="4" ry="2.5" fill="#ffa0a0" stroke="none"/><ellipse cx="73" cy="60" rx="4" ry="2.5" fill="#ffa0a0" stroke="none"/><path d="M42 94L42 100M58 94L58 100" stroke="#f5a742"/>`)},
{n:'小企鵝',s:S(`<ellipse cx="14" cy="62" rx="8" ry="17" fill="#4b5d82" transform="rotate(12 14 62)"/><ellipse cx="86" cy="62" rx="8" ry="17" fill="#4b5d82" transform="rotate(-12 86 62)"/><ellipse cx="50" cy="56" rx="33" ry="38" fill="#4b5d82"/><ellipse cx="50" cy="66" rx="22" ry="27" fill="#fff"/><circle cx="39" cy="42" r="4" fill="${L}"/><circle cx="61" cy="42" r="4" fill="${L}"/><path d="M43 50L57 50L50 59Z" fill="#ffa53a"/><ellipse cx="30" cy="52" rx="4" ry="2.5" fill="#ffa0a0" stroke="none"/><ellipse cx="70" cy="52" rx="4" ry="2.5" fill="#ffa0a0" stroke="none"/><ellipse cx="38" cy="95" rx="9" ry="4" fill="#ffa53a"/><ellipse cx="62" cy="95" rx="9" ry="4" fill="#ffa53a"/>`)},
{n:'小綿羊',s:S(`<rect x="36" y="84" width="7" height="14" fill="#6b5650"/><rect x="58" y="84" width="7" height="14" fill="#6b5650"/><g>${cl.map(c=>`<circle cx="${c[0]}" cy="${c[1]}" r="${c[2]}" fill="#fff"/>`).join('')}</g><g stroke="none" fill="#fff">${cl.map(c=>`<circle cx="${c[0]}" cy="${c[1]}" r="${c[2]-1.5}"/>`).join('')}</g><ellipse cx="28" cy="56" rx="6" ry="10" fill="#6b5650" transform="rotate(30 28 56)"/><ellipse cx="72" cy="56" rx="6" ry="10" fill="#6b5650" transform="rotate(-30 72 56)"/><ellipse cx="50" cy="60" rx="17" ry="19" fill="#f1d3b0"/><circle cx="43" cy="57" r="3" fill="${L}"/><circle cx="57" cy="57" r="3" fill="${L}"/><ellipse cx="38" cy="66" rx="3.5" ry="2" fill="#ffa0a0" stroke="none"/><ellipse cx="62" cy="66" rx="3.5" ry="2" fill="#ffa0a0" stroke="none"/><path d="M46 67Q50 71 54 67"/>`)}
];
let cur=0;
const pk=$('#pick');
CH.forEach((c,i)=>{const b=document.createElement('button');b.innerHTML=c.s+c.n;b.onclick=()=>{cur=i;draw()};pk.appendChild(b)});
function draw(){[...pk.children].forEach((b,i)=>b.classList.toggle('on',i==cur));$('#bar').innerHTML=CH[cur].s}
draw();
const ICON={coffee:'☕',latte:'☕🥛',cake:'🍰'},NAME={coffee:'美式',latte:'拿鐵',cake:'蛋糕'};
const ORD=[['coffee'],['latte'],['cake'],['latte'],['coffee','cake'],['latte','cake'],['coffee','coffee']];
const PETS=['🐱','🐶','🐰','🐻','🐼','🦊','🐯','🐨'];
const QS=[[50,62],[78,62],[22,62]],TS=[[20,83.5],[50,83.5],[80,83.5]];
let run=false,coins=0,served=0,missed=0,left=90,tray=[],queue=[],seats=[null,null,null],brewing=false,spawnT=0,last=0;
const sc=$('#scene');

function serve(){
 if(!run)return;
 const c=queue[0];
 if(!c||!c.ready)return toast('還沒有客人點餐喔');
 if(!tray.length)return toast('托盤是空的！先做餐點');
 const a=[...tray].sort().join(),b=[...c.o].sort().join();
 const bar=$('#bar');bar.classList.remove('hop');void bar.offsetWidth;bar.classList.add('hop');
 tray=[];showTray();queue.shift();c.ready=false;
 if(a!=b){toast('拿錯餐點啦！😭');pop(...QS[0],'😡');missed++;c.el.firstChild.style.display='none';leave(c,false);layout();return}
 const r=Math.round((20+c.o.length*10+Math.round(c.p/c.max*10))*LV[lv].m);coins+=r;served++;hud();
 pop(QS[0][0],55,'+'+r+'🪙');
 c.el.firstChild.style.display='none';layout();
 const si=seats.findIndex(s=>!s);
 if(si<0){leave(c,true);return}
 seats[si]=c;place(c,...TS[si]);
 setTimeout(()=>{c.el.firstChild.innerHTML='😋'+c.o.map(i=>ICON[i]).join('');c.el.firstChild.style.display='block'},1300);
 setTimeout(()=>{if(!run&&left>0)return;coins+=5;hud();pop(TS[si][0],TS[si][1]-10,'小費+5');seats[si]=null;leave(c,true)},8500);
}

function loop(t){

 if(left<=0){return finish()}

 const c=queue[0];
 if(c){if(!c.ready&&t>=c.at&&c.at){c.ready=true;bub(c)}
  if(c.ready){c.p-=dt;const i=c.el.querySelector('.p i');if(i){i.style.width=c.p/c.max*100+'%';i.style.background=c.p<10?'#e5604f':'#7ccf6b'}
   if(c.p<=0){queue.shift();missed++;toast('客人等太久生氣走了 💢');leave(c,false);layout()}}}
 hud();requestAnimationFrame(loop);
}
